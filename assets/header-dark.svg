<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="Terminal window. som tripathi, software, ai, quant and research. Computer vision research intern at AIIRA, ml research intern at TAIC, Iowa State University.">
