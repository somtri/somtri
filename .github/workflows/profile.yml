name: profile

# Regenerates the SVG cards in assets/ once a day.
#
# Uses only first-party actions (actions/checkout, actions/github-script) so there is
# no third-party action to rot. Verified 2026-08-14 against GitHub's own API:
#   actions/checkout      v7.0.1  (released 2026-07-20)
#   actions/github-script v9.0.0  (released 2026-04-09)
#
# The cron deliberately avoids the top of the hour: GitHub documents that scheduled
# workflows are delayed during high load, and that queued jobs may be dropped.
#
# Caveat worth knowing: GitHub disables scheduled workflows after 60 days of
# repository inactivity. Run this workflow from the Actions tab to re-arm it.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repo
        uses: actions/checkout@v7.0.1

      - name: Regenerate the SVG cards
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { default: build } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/build-profile.mjs`
            )
            await build({ github, context, core })

      - name: Commit the cards that changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Another run can push while this one is rendering, which makes a plain
          # push fail as non-fast-forward (observed 2026-08-14). Move onto the newest
          # remote commit before committing, keeping the cards this run generated:
          # they are a pure function of current GitHub data, so they always win.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --soft origin/main
            git add assets
            if git diff --cached --quiet; then
              echo "No card changed. Nothing to commit."
              exit 0
            fi
            git commit --quiet -m "chore: refresh profile cards"
            if git push --quiet origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}. Retrying against the new tip."
            git reset --quiet --soft HEAD~1
          done
          echo "Could not push after 3 attempts."
          exit 1
